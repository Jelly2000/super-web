name: Deploy

# Reusable deploy job shared by pr-release.yml (environment: preview) and
# master-release.yml (environment: production). Builds the OpenNext bundle,
# syncs static assets to S3, updates the 4 Lambda functions OpenNext produces,
# and invalidates CloudFront. See docs/deployment.md for the AWS resources and
# GitHub Environment secrets/variables this assumes already exist.

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
    outputs:
      preview_url:
        value: ${{ jobs.deploy.outputs.preview_url }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    outputs:
      preview_url: ${{ steps.url.outputs.value }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      S3_BUCKET: ${{ vars.S3_BUCKET_NAME }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      SERVER_FUNCTION_NAME: ${{ vars.SERVER_FUNCTION_NAME }}
      IMAGE_FUNCTION_NAME: ${{ vars.IMAGE_FUNCTION_NAME }}
      REVALIDATION_FUNCTION_NAME: ${{ vars.REVALIDATION_FUNCTION_NAME }}
      WARMER_FUNCTION_NAME: ${{ vars.WARMER_FUNCTION_NAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run type-check

      - run: npm run test

      - name: Build OpenNext bundle
        run: npm run opennext:build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync static assets and ISR cache to S3
        run: |
          aws s3 sync .open-next/assets "s3://${S3_BUCKET}" --delete
          aws s3 sync .open-next/cache "s3://${S3_BUCKET}/_cache" --delete

      - name: Deploy Lambda functions
        run: |
          set -euo pipefail
          deploy_fn () {
            local bundle="$1" name="$2"
            (cd "$bundle" && zip -rq /tmp/fn.zip .)
            aws lambda update-function-code --function-name "$name" --zip-file fileb:///tmp/fn.zip --publish >/dev/null
            rm -f /tmp/fn.zip
          }
          deploy_fn ".open-next/server-functions/default" "$SERVER_FUNCTION_NAME"
          deploy_fn ".open-next/image-optimization-function" "$IMAGE_FUNCTION_NAME"
          deploy_fn ".open-next/revalidation-function" "$REVALIDATION_FUNCTION_NAME"
          deploy_fn ".open-next/warmer-function" "$WARMER_FUNCTION_NAME"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"

      - id: url
        run: echo "value=https://${{ vars.CLOUDFRONT_DOMAIN }}" >> "$GITHUB_OUTPUT"
