name: Master Release

# Production build/deploy. Runs on every push to master (i.e. whenever a PR
# merges) and can also be triggered manually. Deploys to the `production`
# GitHub Environment — see docs/deployment.md for required secrets/vars.

on:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
    secrets: inherit
