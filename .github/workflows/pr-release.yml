name: PR Release

# Deploys every PR push to a single SHARED preview environment (see
# docs/deployment.md). This is not per-PR isolation: whichever PR pushes
# last "owns" the preview link until another PR deploys over it. Full
# per-PR isolation would need separate Lambda/CloudFront stacks per PR
# (e.g. via SST) — out of scope for now, see the PR comment caveat below.

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-deploy
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      environment: preview
    secrets: inherit

  comment:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- pr-preview-comment -->';
            const url = '${{ needs.deploy.outputs.preview_url }}';
            const body = [
              marker,
              '### Preview deployed',
              '',
              url,
              '',
              '> This is a single shared preview environment. If another PR deploys after this one, the link above will show their changes instead of yours.',
              '',
              `_Updated at ${new Date().toISOString()}_`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
