name: PR Cleanup

# The preview environment is a single SHARED slot (see pr-release.yml), so
# there's no per-PR infrastructure to tear down here. This just marks the
# PR's preview comment stale, since the shared link may now reflect a
# different, more-recently-deployed PR.

on:
  pull_request:
    branches: [master]
    types: [closed]

permissions:
  pull-requests: write

jobs:
  note-closed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- pr-preview-comment -->';
            const body = [
              marker,
              '### PR closed',
              '',
              "This PR is closed. The shared preview environment now reflects whichever PR deployed to it most recently, which may no longer be this one.",
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            }
